id: aapl_revenue_contains
description: Agent retrieves Apple's most recent quarterly revenue; verified by contains and judge
input: "What was Apple's revenue in its most recent quarter?"
tags: [retrieval, contains, single-company]
trials: 4
expected:
  contains: ["Apple"]
  trajectory:
    - tool: lookup_cik
    - tool: get_company_facts
scoring:
  - type: contains
  - type: trajectory
  - type: judge
    rubric: >
      The response states Apple's most recent quarterly revenue with the
      quarter identified (period ending early 2026) and cites the source
      filing. The answer provides a specific dollar amount. No invented
      figures.
pass_policy: all
thresholds:
  pass_rate_min: 0.75
