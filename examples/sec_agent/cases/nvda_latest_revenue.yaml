id: nvda_latest_revenue
description: Agent retrieves Nvidia's most recent quarterly revenue from frozen fixtures
input: "What was Nvidia's revenue in its most recent quarter?"
tags: [retrieval, numeric, single-company]
trials: 4
expected:
  numeric:
    # Q1 FY2027 (period ending 2026-04-26) from EDGAR XBRL fixtures.
    value: 81615000000
    tolerance_pct: 2.0
  contains: ["Nvidia", "81"]
  trajectory:
    - tool: lookup_cik
    - tool: get_company_facts
      args_contain: {cik: "0001045810"}
scoring:
  - type: numeric
  - type: trajectory
  - type: judge
    rubric: >
      The response states Nvidia's most recent quarterly revenue, identifies
      which quarter it is (period ending around April 2026), and cites the
      source filing. It does not invent numbers absent from the filings.
pass_policy: all
thresholds:
  pass_rate_min: 0.75
